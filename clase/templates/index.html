<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estructuras de Datos - Pilas y Colas Multimedia</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex flex-column">

    <!-- Header -->
    <header class="bg-primary text-white py-3 shadow-sm">
        <div class="container text-center">
            <h1 class="h3 mb-0"><i class="bi bi-diagram-3-fill me-2"></i>Simulador de Estructuras de Datos</h1>
            <small class="text-white-50">Soporta Pilas (LIFO) y Colas (FIFO) con Texto e Imágenes de Cámara</small>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="container my-4 flex-grow-1">
        
        <!-- Seleccionar Estructura (Pila vs Cola) -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="btn-group w-100 shadow-sm" role="group">
                    <input type="radio" class="btn-check" name="structRadio" id="radioStack" value="stack" checked>
                    <label class="btn btn-outline-primary py-2 fw-bold fs-5" for="radioStack">
                        <i class="bi bi-layers-fill me-2"></i>PILA (LIFO - Last In, First Out)
                    </label>

                    <input type="radio" class="btn-check" name="structRadio" id="radioQueue" value="queue">
                    <label class="btn btn-outline-primary py-2 fw-bold fs-5" for="radioQueue">
                        <i class="bi bi-segmented-nav me-2"></i>COLA (FIFO - First In, First Out)
                    </label>
                </div>
            </div>
        </div>

        <div class="row g-4">
            
            <!-- Panel Izquierdo: Controles -->
            <div class="col-md-5">
                
                <!-- Ajuste de Capacidad -->
                <div class="card shadow-sm mb-3">
                    <div class="card-header bg-white fw-bold">
                        <i class="bi bi-gear-fill me-1"></i> Capacidad de la Estructura
                    </div>
                    <div class="card-body py-2">
                        <form id="configForm" class="row g-2 align-items-center">
                            <div class="col-8">
                                <input type="number" id="capacityInput" class="form-control" min="1" max="15" value="5" required>
                            </div>
                            <div class="col-4">
                                <button type="submit" class="btn btn-outline-primary w-100 fw-bold">Reiniciar</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Entrada de Datos: Texto / Cámara -->
                <div class="card shadow-sm">
                    <div class="card-header bg-white p-0">
                        <ul class="nav nav-tabs nav-fill card-header-tabs m-0" id="entryTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active py-3 fw-bold" id="text-tab" data-bs-toggle="tab" data-bs-target="#text-pane" type="button" role="tab">
                                    <i class="bi bi-fonts me-1"></i> Texto
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link py-3 fw-bold" id="cam-tab" data-bs-toggle="tab" data-bs-target="#cam-pane" type="button" role="tab">
                                    <i class="bi bi-camera-fill me-1"></i> Cámara Web
                                </button>
                            </li>
                        </ul>
                    </div>

                    <div class="card-body">
                        <div class="tab-content" id="entryTabsContent">
                            
                            <!-- Tab 1: Texto -->
                            <div class="tab-pane fade show active" id="text-pane" role="tabpanel">
                                <form id="textPushForm">
                                    <div class="mb-3">
                                        <label for="textInput" class="form-label small text-muted">Ingresa un texto:</label>
                                        <input type="text" id="textInput" class="form-control" placeholder="Ejemplo: Dato Alpha">
                                    </div>
                                    <button type="submit" id="addTextBtn" class="btn btn-success w-100 fw-bold">
                                        <i class="bi bi-plus-circle me-1"></i> Apilar Texto
                                    </button>
                                </form>
                            </div>

                            <!-- Tab 2: Cámara -->
                            <div class="tab-pane fade text-center" id="cam-pane" role="tabpanel">
                                <div class="bg-dark rounded overflow-hidden mb-2 d-flex align-items-center justify-content-center" style="height: 200px;">
                                    <video id="webcam" autoplay playsinline class="w-100 h-100 object-fit-cover d-none"></video>
                                    <canvas id="photoCanvas" class="w-100 h-100 object-fit-cover d-none" width="320" height="240"></canvas>
                                    <div id="camPlaceholder" class="text-white-50">
                                        <i class="bi bi-camera-video-off fs-1 d-block mb-1"></i>
                                        Cámara desactivada
                                    </div>
                                </div>

                                <div class="d-flex gap-2 mb-2">
                                    <button type="button" id="startCamBtn" class="btn btn-sm btn-outline-primary flex-fill">
                                        <i class="bi bi-power me-1"></i> Encender
                                    </button>
                                    <button type="button" id="captureBtn" class="btn btn-sm btn-warning flex-fill" disabled>
                                        <i class="bi bi-camera me-1"></i> Tomar Foto
                                    </button>
                                </div>

                                <button type="button" id="addPhotoBtn" class="btn btn-success w-100 fw-bold" disabled>
                                    <i class="bi bi-plus-circle me-1"></i> Apilar Foto
                                </button>
                            </div>

                        </div>

                        <hr>

                        <!-- Botones Operacionales -->
                        <div class="d-grid gap-2">
                            <button id="removeBtn" class="btn btn-danger fw-bold">
                                <i class="bi bi-dash-circle me-1"></i> Desapilar (Pop)
                            </button>
                            <button id="peekBtn" class="btn btn-info text-white fw-bold">
                                <i class="bi bi-eye me-1"></i> Ver Tope (Peek)
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Caja de Alertas -->
                <div id="alertBox" class="alert alert-info mt-3 d-none shadow-sm" role="alert"></div>
            </div>

            <!-- Panel Derecho: Visualizador -->
            <div class="col-md-7">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white fw-bold d-flex justify-content-between align-items-center">
                        <span id="visualizerTitle"><i class="bi bi-stack me-1"></i> Estructura Visual de la Pila</span>
                        <span id="structStatus" class="badge bg-primary fs-6">0 / 5</span>
                    </div>
                    <div class="card-body d-flex flex-column justify-content-end p-3">
                        <div id="structContainer" class="d-flex flex-column-reverse gap-2 border border-3 border-primary border-top-0 rounded-bottom p-3" style="min-height: 400px; background-color: #f8f9fa;">
                            <div class="text-center text-muted my-auto" id="emptyMessage">
                                <i class="bi bi-inbox fs-1 d-block text-secondary"></i>
                                Estructura vacía
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Modal para Inspeccionar Elemento (Peek) -->
    <div class="modal fade" id="peekModal" tabindex="-1" aria-labelledby="peekModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title fw-bold" id="peekModalLabel">
                        <i class="bi bi-eye-fill me-2"></i>Inspeccionar Elemento
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body text-center py-4" id="peekModalBody">
                    <!-- Dinámico -->
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary fw-bold" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Estado Global
        let currentStruct = 'stack'; // 'stack' o 'queue'
        let serverData = { stack: { items: [], capacity: 5 }, queue: { items: [], capacity: 5 } };

        // DOM
        const structContainer = document.getElementById('structContainer');
        const emptyMessage = document.getElementById('emptyMessage');
        const structStatus = document.getElementById('structStatus');
        const alertBox = document.getElementById('alertBox');
        const capacityInput = document.getElementById('capacityInput');
        const visualizerTitle = document.getElementById('visualizerTitle');
        const addTextBtn = document.getElementById('addTextBtn');
        const addPhotoBtn = document.getElementById('addPhotoBtn');
        const removeBtn = document.getElementById('removeBtn');
        const peekBtn = document.getElementById('peekBtn');

        // Cámara
        const webcam = document.getElementById('webcam');
        const photoCanvas = document.getElementById('photoCanvas');
        const camPlaceholder = document.getElementById('camPlaceholder');
        const startCamBtn = document.getElementById('startCamBtn');
        const captureBtn = document.getElementById('captureBtn');

        // Modal
        const peekModal = new bootstrap.Modal(document.getElementById('peekModal'));
        const peekModalBody = document.getElementById('peekModalBody');

        let mediaStream = null;
        let capturedDataUrl = null;

        function showAlert(msg, type = 'info') {
            alertBox.className = `alert alert-${type} mt-3 shadow-sm`;
            alertBox.textContent = msg;
            alertBox.classList.remove('d-none');
        }

        // Actualiza etiquetas de la interfaz según la estructura activa
        function updateUIControls() {
            if (currentStruct === 'stack') {
                visualizerTitle.innerHTML = `<i class="bi bi-layers-fill me-1"></i> Visualizador de Pila (LIFO)`;
                addTextBtn.innerHTML = `<i class="bi bi-plus-circle me-1"></i> Apilar Texto (Push)`;
                addPhotoBtn.innerHTML = `<i class="bi bi-plus-circle me-1"></i> Apilar Foto (Push)`;
                removeBtn.innerHTML = `<i class="bi bi-dash-circle me-1"></i> Desapilar Elemento (Pop)`;
                peekBtn.innerHTML = `<i class="bi bi-eye me-1"></i> Ver Tope (Peek)`;
                structContainer.className = "d-flex flex-column-reverse gap-2 border border-3 border-primary border-top-0 rounded-bottom p-3";
            } else {
                visualizerTitle.innerHTML = `<i class="bi bi-segmented-nav me-1"></i> Visualizador de Cola (FIFO)`;
                addTextBtn.innerHTML = `<i class="bi bi-plus-circle me-1"></i> Encolar Texto (Enqueue)`;
                addPhotoBtn.innerHTML = `<i class="bi bi-plus-circle me-1"></i> Encolar Foto (Enqueue)`;
                removeBtn.innerHTML = `<i class="bi bi-dash-circle me-1"></i> Desencolar Frente (Dequeue)`;
                peekBtn.innerHTML = `<i class="bi bi-eye me-1"></i> Ver Frente (Peek)`;
                structContainer.className = "d-flex flex-column gap-2 border border-3 border-success border-top-0 rounded-bottom p-3";
            }
            renderCurrentStructure();
        }

        // Renderiza el contenido en pantalla
        function renderCurrentStructure() {
            const data = serverData[currentStruct];
            capacityInput.value = data.capacity;
            structStatus.textContent = `${data.items.length} / ${data.capacity}`;
            structContainer.innerHTML = '';

            if (!data.items || data.items.length === 0) {
                structContainer.appendChild(emptyMessage);
                return;
            }

            data.items.forEach((item, index) => {
                const total = data.items.length;
                let badgeText = `[${index}]`;
                let badgeColor = 'bg-secondary';

                if (currentStruct === 'stack') {
                    if (index === total - 1) { badgeText = 'TOPE'; badgeColor = 'bg-warning text-dark'; }
                } else {
                    if (index === 0) { badgeText = 'FRENTE (Sale Primero)'; badgeColor = 'bg-success text-white'; }
                    else if (index === total - 1) { badgeText = 'FINAL (Último Entrado)'; badgeColor = 'bg-info text-white'; }
                }

                const card = document.createElement('div');
                card.className = `p-2 rounded border shadow-sm ${
                    (currentStruct === 'stack' && index === total - 1) || (currentStruct === 'queue' && index === 0)
                        ? 'bg-primary text-white border-primary'
                        : 'bg-white text-dark border-secondary-subtle'
                }`;

                let contentHtml = item.type === 'text' 
                    ? `<span class="fs-5 fw-bold">${item.content}</span>`
                    : `<img src="${item.content}" class="rounded border" style="max-height: 75px; width: auto; object-fit: contain;">`;

                card.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="badge ${badgeColor}">${badgeText} (${item.type.toUpperCase()})</span>
                        <div>${contentHtml}</div>
                        <i class="bi bi-box-seam fs-5"></i>
                    </div>
                `;
                structContainer.appendChild(card);
            });
        }

        // Cambiar entre Pila y Cola
        document.querySelectorAll('input[name="structRadio"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                currentStruct = e.target.value;
                updateUIControls();
            });
        });

        // Cámara
        startCamBtn.addEventListener('click', async () => {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
                webcam.classList.add('d-none');
                photoCanvas.classList.add('d-none');
                camPlaceholder.classList.remove('d-none');
                startCamBtn.textContent = 'Encender';
                startCamBtn.className = 'btn btn-sm btn-outline-primary flex-fill';
                captureBtn.disabled = true;
                addPhotoBtn.disabled = true;
                return;
            }

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: true });
                webcam.srcObject = mediaStream;
                webcam.classList.remove('d-none');
                camPlaceholder.classList.add('d-none');
                photoCanvas.classList.add('d-none');
                startCamBtn.textContent = 'Apagar';
                startCamBtn.className = 'btn btn-sm btn-outline-danger flex-fill';
                captureBtn.disabled = false;
            } catch (err) {
                showAlert('No se pudo acceder a la cámara.', 'danger');
            }
        });

        captureBtn.addEventListener('click', () => {
            const ctx = photoCanvas.getContext('2d');
            ctx.drawImage(webcam, 0, 0, photoCanvas.width, photoCanvas.height);
            capturedDataUrl = photoCanvas.toDataURL('image/jpeg', 0.7);
            webcam.classList.add('d-none');
            photoCanvas.classList.remove('d-none');
            addPhotoBtn.disabled = false;
            showAlert('Fotografía capturada. Haz clic en guardar.', 'info');
        });

        // Insertar Texto (Push / Enqueue)
        document.getElementById('textPushForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('textInput');
            const content = input.value.trim();
            if (!content) return;

            const res = await fetch('/api/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ struct: currentStruct, type: 'text', content })
            });
            const data = await res.json();
            if (data.success) {
                showAlert(data.message, 'success');
                serverData[currentStruct].items = data.items;
                renderCurrentStructure();
                input.value = '';
            } else {
                showAlert(data.message, 'danger');
            }
        });

        // Insertar Imagen (Push / Enqueue)
        addPhotoBtn.addEventListener('click', async () => {
            if (!capturedDataUrl) return;

            const res = await fetch('/api/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ struct: currentStruct, type: 'image', content: capturedDataUrl })
            });
            const data = await res.json();
            if (data.success) {
                showAlert(data.message, 'success');
                serverData[currentStruct].items = data.items;
                renderCurrentStructure();
                addPhotoBtn.disabled = true;
                photoCanvas.classList.add('d-none');
                webcam.classList.remove('d-none');
                capturedDataUrl = null;
            } else {
                showAlert(data.message, 'danger');
            }
        });

        // Extraer Elemento (Pop / Dequeue)
        removeBtn.addEventListener('click', async () => {
            const res = await fetch('/api/remove', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ struct: currentStruct })
            });
            const data = await res.json();
            if (data.success) {
                showAlert(data.message, 'warning');
                serverData[currentStruct].items = data.items;
                renderCurrentStructure();
            } else {
                showAlert(data.message, 'danger');
            }
        });

        // Inspeccionar (Peek)
        peekBtn.addEventListener('click', async () => {
            const res = await fetch(`/api/peek?struct=${currentStruct}`);
            const data = await res.json();
            if (data.success) {
                const item = data.item;
                const posStr = currentStruct === 'stack' ? 'TOPE DE LA PILA' : 'FRENTE DE LA COLA';
                peekModalBody.innerHTML = item.type === 'text' ? `
                    <div class="p-3">
                        <span class="badge bg-secondary mb-2">${posStr}</span>
                        <h3 class="fw-bold text-primary mt-2">${item.content}</h3>
                    </div>
                ` : `
                    <div>
                        <span class="badge bg-secondary mb-3">${posStr}</span>
                        <div class="border rounded p-2 bg-light shadow-sm">
                            <img src="${item.content}" class="img-fluid rounded" style="max-height: 350px; object-fit: contain;">
                        </div>
                    </div>
                `;
                peekModal.show();
            } else {
                showAlert(data.message, 'danger');
            }
        });

        // Cambiar Capacidad
        document.getElementById('configForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ struct: currentStruct, capacity: capacityInput.value })
            });
            const data = await res.json();
            if (data.success) {
                showAlert(data.message, 'success');
                serverData[currentStruct].items = data.items;
                serverData[currentStruct].capacity = data.capacity;
                renderCurrentStructure();
            } else {
                showAlert(data.message, 'danger');
            }
        });

        // Cargar Estado Inicial
        async function fetchState() {
            const res = await fetch('/api/state');
            serverData = await res.json();
            updateUIControls();
        }
        fetchState();
    </script>
</body>
</html>
